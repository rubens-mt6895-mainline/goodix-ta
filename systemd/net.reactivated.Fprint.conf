<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- goodix-fprintd: our own fprintd-compatible provider for the K50's
       Goodix sensor (there is no libfprint driver for it). -->
  <policy user="root">
    <allow own="net.reactivated.Fprint"/>
    <allow send_destination="net.reactivated.Fprint"/>
    <allow receive_sender="net.reactivated.Fprint"/>
  </policy>

  <policy context="default">
    <!-- Plasma's System Settings (kcm_users.so) and anything else that speaks
         the fprintd protocol may talk to the service. -->
    <allow send_destination="net.reactivated.Fprint"/>
    <allow receive_sender="net.reactivated.Fprint"/>
  </policy>
</busconfig>
